<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicWaste GIS - Submit Report</title>
    <link rel="stylesheet" href="./whatsappfeed.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <div class="form-header">
                <h1>Submit Bin Report</h1>
                <p>Report the status of a waste bin in real-time</p>
            </div>

            <form id="report-form" class="report-form">
                <div class="form-group">
                    <label for="bin-id">Bin ID *</label>
                    <select id="bin-id" name="bin_id" required>
                        <option value="">Loading bins...</option>
                    </select>
                    <small>Select a bin from the system</small>
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" name="status" required>
                        <option value="">Select status...</option>
                        <option value="empty">Empty (0-20%)</option>
                        <option value="quarter">Quarter Full (20-50%)</option>
                        <option value="half">Half Full (50-80%)</option>
                        <option value="full">Full (80-100%)</option>
                        <option value="overflow">Overflow (>100%)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reporter-name">Your Name *</label>
                    <input type="text" id="reporter-name" name="reporter_name" placeholder="e.g., John Banda" required>
                    <small>Who is reporting this</small>
                </div>

                <div class="form-group">
                    <label for="reporter-phone">Phone Number</label>
                    <input type="tel" id="reporter-phone" name="reporter_phone" placeholder="+265 99 123 4567">
                    <small>Optional: for follow-up contact</small>
                </div>

                <div class="form-group">
                    <label for="notes">Additional Notes</label>
                    <textarea id="notes" name="notes" placeholder="e.g., Bin damaged, overflowing into street..." rows="3"></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Report</button>
                <p class="form-help">
                    <a href="../dashboard/dashboard.html">← Back to Dashboard</a>
                </p>
            </form>

            <div id="success-message" class="success-message hidden">
                <h3>Report Submitted!</h3>
                <p>Thank you. Your report has been recorded.</p>
                <button class="btn-reset">Submit Another Report</button>
            </div>

            <div id="error-message" class="error-message hidden">
                <h3>Error</h3>
                <p id="error-text"></p>
                <button class="btn-retry">Try Again</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../shared/supabaseConfig.js"></script>
    <script src="../shared/utils.js"></script>
    <script src="./whatsappfeed.js"></script>
</body>
</html>
